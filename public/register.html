<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — РемМастер</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">🔧 РемМастер</a>
            <nav class="nav">
                <a href="index.html" class="nav-link">Услуги</a>
                <a href="login.html" class="btn btn-outline">Войти</a>
                <a href="register.html" class="nav-link active">Регистрация</a>
            </nav>
        </div>
    </header>

    <main class="container auth-main">
        <div class="auth-container">
            <h2>Создание аккаунта</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="full_name">ФИО</label>
                    <input type="text" id="full_name" name="full_name" required placeholder="Иван Иванов">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input type="tel" id="phone" name="phone" placeholder="+7 (900) 000-00-00">
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Повторите пароль</label>
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
            </form>
            <p class="auth-switch">Уже есть аккаунт? <a href="login.html">Войти</a></p>
        </div>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
